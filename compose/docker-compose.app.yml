services:
  app-api:
    image: ghcr.io/xenit-eu/contentgrid-appserver:SNAPSHOT@sha256:0d76cfc9275e6a806496919426c80491b97fe297bfd7d4273a5ae69260b30d9c
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/app/config/application.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-database/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://gateway:8081/actuator/jwks/apps

      CONTENTGRID_EVENTS_WEBHOOKCONFIGURL: http://app-api:8081/actuator/webhooks
      CONTENTGRID_APPSERVER_BLUEPRINTARTIFACT_LOCATION: file:/etc/app/config
      CONTENTGRID_SYSTEM_APPLICATIONID: app1
      CONTENTGRID_SYSTEM_DEPLOYMENTID: depl1

      # opa-sidecar mode: the app authorizes requests itself against its own OPA sidecar
      CONTENTGRID_THUNX_ABAC_SOURCE: opa
      OPA_SERVICE_URL: http://app-opa:8181
      OPA_QUERY: data.contentgrid.appserver.allow == true

    volumes:
      - ./config/app:/etc/app/config:ro
    depends_on:
      gateway:
        condition: service_started
      app-database:
        condition: service_started
      app-opa:
        condition: service_started

  # OPA sidecar for app-api; pulls the policy bundle from the app's /actuator/policybundle endpoint
  app-opa:
    image: docker.io/openpolicyagent/opa:1.22.0@sha256:895872de1e8dc5b82e04f9410d2d1ada2f72d28fdcdba0e8789d91cfc27ec0d0
    command: ["run", "--server", "--addr=:8181", "--skip-version-check", "--log-level=error", "--config-file=/etc/opa/config.yml"]
    volumes:
      - ./config/opa:/etc/opa:ro

  app-database:
    image: docker.io/library/postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

  navigator:
    image: ghcr.io/xenit-eu/contentgrid-navigator:main@sha256:0b3e6791f423dd1539f2c4bb45e81393e58118c2369ff7ce2121decc59342250
    ports:
      - "8085:8080"
    environment:
      API_BASE_URL: http://localhost:8080
      OIDC_AUTHORITY: http://${DOCKER_HOST_IP:-172.17.0.1}:8082/realms/cg-holmes
      OIDC_CLIENT_ID: navigator

  test-webhook-receiver:
    image: ghcr.io/mendhak/http-https-echo:41
    environment:
      HTTP_PORT: 8888
      JWT_HEADER: contentgrid-signature
      ECHO_BACK_TO_CLIENT: "false"
    ports:
      - "8888:8888"
