
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    volumes:
      - ./bootstrap/keycloak/:/opt/keycloak/data/import/:ro
    ports:
      - 8082:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/keycloak/data/import/readyness.sh"]
      start_period: 1m

  gateway:
    image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:bc137707160891bc72ce3de3aa5d7200e62367c15dfbb5e16cd41e05808efee5
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/gateway/config/application.yml,/etc/gateway/config/app.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      DOCKER_HOST_IP: "${DOCKER_HOST_IP:-172.17.0.1}"
    volumes:
      - ./config/gateway:/etc/gateway/config:ro
      - gateway_keys:/etc/gateway/keys:ro
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully
        restart: true
  gateway-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:33f59fa36efc3e9faed6b628e4176575f415c101b5ad1fd2e7aff2a014443ef1
    volumes:
      - ./bootstrap/gateway:/bootstrap:ro
      - gateway_keys:/etc/gateway/secrets:rw
    working_dir: /etc/gateway/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]

  rabbitmq:
    image: docker.io/rabbitmq:4.4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: $RABBITMQ_PASSWORD
    healthcheck:
      test: ["CMD", "rabbitmqctl", "node_health_check"]
      start_period: 1m

  rabbitmq-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:33f59fa36efc3e9faed6b628e4176575f415c101b5ad1fd2e7aff2a014443ef1
    command: ["bash", "-c", "/tmp/rabbitmq/setup.sh"]
    environment:
      RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./bootstrap/rabbitmq:/tmp/rabbitmq:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
  tokenmonger:
    image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:39fe2be648cd35c16e2c781209c7e63c1d1e61c481a376d331023f7e63eed160
    ports:
      - "8081:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/tokenmonger/config/application.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      CONTENTGRID_TOKENMONGER_USERAPPLICATIONACCESS_JWKSETURI: "http://gateway:8081/actuator/jwks/authentication"
      CONTENTGRID_TOKENMONGER_EXTENSION_IDENTITY_ISSUER: http://${DOCKER_HOST_IP:-172.17.0.1}:8082/realms/extensions
    volumes:
      - ./config/tokenmonger:/etc/tokenmonger/config:ro
      - tokenmonger_keys:/etc/tokenmonger/keys:ro
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      gateway:
        condition: service_started
      tokenmonger-bootstrap:
        condition: service_completed_successfully
        restart: true

  tokenmonger-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:33f59fa36efc3e9faed6b628e4176575f415c101b5ad1fd2e7aff2a014443ef1
    volumes:
      - ./bootstrap/tokenmonger:/bootstrap:ro
      - tokenmonger_keys:/etc/tokenmonger/secrets:rw
    working_dir: /etc/tokenmonger/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]

  slingshot:
    image: ghcr.io/xenit-eu/contentgrid-slingshot:SNAPSHOT@sha256:e9e3c2a83cea2133999292688f381e9fe4cde98565f43a3c96396867120b3aea
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/slingshot/config/application.yml
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./config/slingshot:/etc/slingshot/config:ro

volumes:
  gateway_keys:
  tokenmonger_keys:
