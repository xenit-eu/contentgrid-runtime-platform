
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    volumes:
      - ./bootstrap/keycloak/:/opt/keycloak/data/import/:ro
    ports:
      - 8082:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/keycloak/data/import/readyness.sh"]
      start_period: 1m

  gateway:
    image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:b9a87c0277e535b9ce36d97c52c584db7af11f5e61a978d6ba50611999ec8ebe
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/gateway/config/application.yml,/etc/gateway/config/app.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      DOCKER_HOST_IP: "${DOCKER_HOST_IP:-172.17.0.1}"
    volumes:
      - ./config/gateway:/etc/gateway/config:ro
      - gateway_keys:/etc/gateway/keys:ro
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully
        restart: true
  gateway-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:634ca4179529d01e89e0c902c9eaff689eb637e87392702a917a266c110e2337
    volumes:
      - ./bootstrap/gateway:/bootstrap:ro
      - gateway_keys:/etc/gateway/secrets:rw
    working_dir: /etc/gateway/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]

  rabbitmq:
    image: docker.io/rabbitmq:4.3-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: $RABBITMQ_PASSWORD
    healthcheck:
      test: ["CMD", "rabbitmqctl", "node_health_check"]
      start_period: 1m

  rabbitmq-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:634ca4179529d01e89e0c902c9eaff689eb637e87392702a917a266c110e2337
    command: ["bash", "-c", "/tmp/rabbitmq/setup.sh"]
    environment:
      RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./bootstrap/rabbitmq:/tmp/rabbitmq:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
  tokenmonger:
    image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:605c15553a244b2c3dd8cb07ea5fabdae205b53fe39949cfac0e6fdd2c9c4fa6
    ports:
      - "8081:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/tokenmonger/config/application.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      CONTENTGRID_TOKENMONGER_USERAPPLICATIONACCESS_JWKSETURI: "http://gateway:8081/actuator/jwks/authentication"
      CONTENTGRID_TOKENMONGER_EXTENSION_IDENTITY_ISSUER: http://${DOCKER_HOST_IP:-172.17.0.1}:8082/realms/extensions
    volumes:
      - ./config/tokenmonger:/etc/tokenmonger/config:ro
      - tokenmonger_keys:/etc/tokenmonger/keys:ro
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      gateway:
        condition: service_started
      tokenmonger-bootstrap:
        condition: service_completed_successfully
        restart: true

  tokenmonger-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:634ca4179529d01e89e0c902c9eaff689eb637e87392702a917a266c110e2337
    volumes:
      - ./bootstrap/tokenmonger:/bootstrap:ro
      - tokenmonger_keys:/etc/tokenmonger/secrets:rw
    working_dir: /etc/tokenmonger/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]

  slingshot:
    image: ghcr.io/xenit-eu/contentgrid-slingshot:SNAPSHOT@sha256:5b1463ff536111c3459ea36ee90b17c8c19ac64b79f27e9ced3dd3b40fa29284
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/slingshot/config/application.yml
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./config/slingshot:/etc/slingshot/config:ro

volumes:
  gateway_keys:
  tokenmonger_keys:
