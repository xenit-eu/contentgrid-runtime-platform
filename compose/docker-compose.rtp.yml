
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    volumes:
      - ./bootstrap/keycloak/:/opt/keycloak/data/import/:ro
    ports:
      - 8082:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/keycloak/data/import/readyness.sh"]
      start_period: 1m

  gateway:
    image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:a77671a83e982117b60878e7869db97d991d31887a1b3c23e8d603a1eda84608
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/gateway/config/application.yml,/etc/gateway/config/app.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      DOCKER_HOST_IP: "${DOCKER_HOST_IP:-172.17.0.1}"
      OPA_SERVICE_URL: http://opa:8181
    volumes:
      - ./config/gateway:/etc/gateway/config:ro
      - gateway_keys:/etc/gateway/keys:ro
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully
        restart: true
  gateway-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:1608b21d07abeb1d56a9f7cdfc221f92040bd5eb7f20ef4625a6d5d5804fec1d
    volumes:
      - ./bootstrap/gateway:/bootstrap:ro
      - gateway_keys:/etc/gateway/secrets:rw
    working_dir: /etc/gateway/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]
  opa:
    image: docker.io/openpolicyagent/opa:1.20.2@sha256:7b15f9d96345dfa639322ad97f65a0b38260f95efcdd7f5c24e284228708f06c
    command: ["run", "--server", "--log-level=error", "--authorization=basic", "--v0-compatible", "--config-file", "/etc/opa/config.yml", "file:/etc/opa/system.rego", "file:/var/opa/store"]
    volumes:
      - ./config/opa:/etc/opa:ro
      - ./config/app/rego:/var/opa/store:ro

  rabbitmq:
    image: docker.io/rabbitmq:4.3-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: $RABBITMQ_PASSWORD
    healthcheck:
      test: ["CMD", "rabbitmqctl", "node_health_check"]
      start_period: 1m

  rabbitmq-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:1608b21d07abeb1d56a9f7cdfc221f92040bd5eb7f20ef4625a6d5d5804fec1d
    command: ["bash", "-c", "/tmp/rabbitmq/setup.sh"]
    environment:
      RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./bootstrap/rabbitmq:/tmp/rabbitmq:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
  tokenmonger:
    image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:9c6779d73a4a08101cbbbeda57dbf60495a38809b170b2814021d7bb4c570497
    ports:
      - "8081:8080"
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/tokenmonger/config/application.yml
      TOKENMONGER_HOST: "http://${DOCKER_HOST_IP:-172.17.0.1}:8081"
      CONTENTGRID_TOKENMONGER_USERAPPLICATIONACCESS_JWKSETURI: "http://gateway:8081/actuator/jwks/authentication"
      CONTENTGRID_TOKENMONGER_EXTENSION_IDENTITY_ISSUER: http://${DOCKER_HOST_IP:-172.17.0.1}:8082/realms/extensions
    volumes:
      - ./config/tokenmonger:/etc/tokenmonger/config:ro
      - tokenmonger_keys:/etc/tokenmonger/keys:ro
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      gateway:
        condition: service_started
      tokenmonger-bootstrap:
        condition: service_completed_successfully
        restart: true

  tokenmonger-bootstrap:
    image: ghcr.io/xenit-eu/kubectl@sha256:1608b21d07abeb1d56a9f7cdfc221f92040bd5eb7f20ef4625a6d5d5804fec1d
    volumes:
      - ./bootstrap/tokenmonger:/bootstrap:ro
      - tokenmonger_keys:/etc/tokenmonger/secrets:rw
    working_dir: /etc/tokenmonger/secrets
    command: ["/bin/bash", "-c", "/bootstrap/gen-keys.sh"]

  slingshot:
    image: ghcr.io/xenit-eu/contentgrid-slingshot:SNAPSHOT@sha256:ab81978742d0d3a2df768d76d1d97fa93a0ea546092d3374c617009d9cda0c53
    environment:
      SPRING_CONFIG_IMPORT: file:/etc/slingshot/config/application.yml
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: $RABBITMQ_PASSWORD
    volumes:
      - ./config/slingshot:/etc/slingshot/config:ro

volumes:
  gateway_keys:
  tokenmonger_keys:
