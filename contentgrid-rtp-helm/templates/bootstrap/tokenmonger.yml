# Creates an initial secret for JWT signing for tokenmonger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-tokenmonger-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
  resourceNames:
    - tokenmonger-jwt-delegated-keys
    - tokenmonger-jwt-external-keys
    - tokenmonger-jwt-system-keys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-tokenmonger-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-tokenmonger-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: initialize-tokenmonger-role
subjects:
- kind: ServiceAccount
  name: initialize-tokenmonger-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-tokenmonger-script
data:
  initialize.sh: |
    #!/bin/sh

    if ! kubectl get secret tokenmonger-jwt-delegated-keys; then
        openssl genrsa 2048 | \
        kubectl create secret generic tokenmonger-jwt-delegated-keys --from-file=active-1.pem=/dev/stdin
    fi

    if ! kubectl get secret tokenmonger-jwt-external-keys; then
        openssl genrsa 2048 | \
        kubectl create secret generic tokenmonger-jwt-external-keys --from-file=active-1.pem=/dev/stdin
    fi

    if ! kubectl get secret tokenmonger-jwt-system-keys; then
        openssl genrsa 2048 | \
        kubectl create secret generic tokenmonger-jwt-system-keys --from-file=active-1.pem=/dev/stdin
    fi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-tokenmonger
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: initialize-tokenmonger-sa
      automountServiceAccountToken: true
      containers:
      - name: initialize-tokenmonger-container
        image: bitnami/kubectl
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "/tmp/tokenmonger/initialize.sh"]
        volumeMounts:
          - mountPath: /tmp/tokenmonger
            name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: initialize-tokenmonger-script
---
{{ if .Capabilities.APIVersions.Has "cilium.io/v2" }}
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: initialize-tokenmonger-to-kube-apiserver
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      job-name: initialize-tokenmonger
  egress:
    - toEntities:
        - kube-apiserver
{{ end }}
