# Creates an initial secret for JWT signing for the gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-gateway-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
  resourceNames:
    - gateway-jwt-apps-keys
    - gateway-jwt-authentication-keys
    - gateway-jwt-authentication-encryption-keys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-gateway-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-gateway-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: initialize-gateway-role
subjects:
- kind: ServiceAccount
  name: initialize-gateway-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-gateway-script
data:
  initialize.sh: |
    #!/bin/sh
    set -euo pipefail

    if ! kubectl get secret gateway-jwt-apps-keys; then
        openssl genrsa 2048 | \
        kubectl create secret generic gateway-jwt-apps-keys --from-file=active-1.pem=/dev/stdin
    fi

    if ! kubectl get secret gateway-jwt-authentication-keys; then
        openssl genrsa 2048 | \
        kubectl create secret generic gateway-jwt-authentication-keys --from-file=active-1.pem=/dev/stdin
    fi

    if ! kubectl get secret gateway-jwt-authentication-encryption-keys; then
        openssl rand 32 | \
        kubectl create secret generic gateway-jwt-authentication-encryption-keys --from-file=active-1.bin=/dev/stdin
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-gateway
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: initialize-gateway-sa
      automountServiceAccountToken: true
      containers:
      - name: initialize-gateway-container
        image: ghcr.io/xenit-eu/kubectl
        imagePullPolicy: IfNotPresent
        {{- with .Values.jobs.resourceLimits }}
        resources:
          limits:
            cpu: {{ .cpu }}
            memory: {{ .memory }}
        {{- end }}
        command: ["/bin/sh", "-c", "/tmp/gateway/initialize.sh"]
        volumeMounts:
          - mountPath: /tmp/gateway
            name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: initialize-gateway-script
{{ include "nodeSelection" . | indent 6}}
---
{{/* NetworkPolicy initialize-gateway-to-kube-apiserver */}}
{{- $annotations := (list
  "helm.sh/hook: pre-install,pre-upgrade"
  "helm.sh/hook-weight: '-5'"
  "helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded"
) | join "\n" | fromYaml -}}
{{- $selectorLabels := (list
      "job-name: initialize-gateway"
) | join "\n" | fromYaml -}}
{{- template "contentgrid.apiserver-network-policy"
      dict
        "name" "initialize-gateway-to-kube-apiserver"
        "annotations" $annotations
        "selectorLabels" $selectorLabels
        "rootScope" $ }}
