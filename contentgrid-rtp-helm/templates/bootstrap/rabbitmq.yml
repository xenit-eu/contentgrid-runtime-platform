# Sets up rabbitmq secrets before rabbitmq is installed
# And loads rabbitmq definitions after rabbitmq is up and running
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
  resourceNames:
    - rabbitmq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: initialize-rabbitmq-role
subjects:
- kind: ServiceAccount
  name: initialize-rabbitmq-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-script
data:
  initialize.sh: |
    #!/bin/sh

    if ! kubectl get secret rabbitmq; then
        kubectl create secret generic rabbitmq --from-literal="rabbitmq-password={{ randAlphaNum 16 }}" --from-literal="rabbitmq-erlang-cookie={{ randAlphaNum 32 }}"
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-rabbitmq
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: initialize-rabbitmq-sa
      automountServiceAccountToken: true
      containers:
      - name: initialize-rabbitmq-container
        image: bitnami/kubectl
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "/tmp/rabbitmq/initialize.sh"]
        volumeMounts:
          - mountPath: /tmp/rabbitmq
            name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: initialize-rabbitmq-script
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: initialize-rabbitmq-to-kube-apiserver
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      job-name: initialize-rabbitmq
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-rabbitmq-script
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
data:
  setup.sh: |
    #!/bin/sh

    curl -u user:"$RABBITMQ_PASSWORD"  \
      --fail-with-body \
      -X POST \
      -H "Content-Type: application/json" \
      -T /tmp/rabbitmq/definitions.json \
      http://rabbitmq:15672/api/definitions \

  definitions.json: {{ .Files.Get "definitions/rabbitmq.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-rabbitmq-{{ .Files.Get "definitions/rabbitmq.json" | sha1sum }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
spec:
  template:
    metadata:
      labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      containers:
      - name: setup-rabbitmq-container
        image: bitnami/os-shell
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "/tmp/rabbitmq/setup.sh"]
        env:
          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq
                key: rabbitmq-password
        volumeMounts:
          - mountPath: /tmp/rabbitmq
            name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: setup-rabbitmq-script
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-setup-rabbitmq
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: message-queue
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: setup
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: setup-rabbitmq-to-rabbitmq
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: setup
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: message-queue
