# Sets up rabbitmq secrets before rabbitmq is installed
# And loads rabbitmq definitions after rabbitmq is up and running
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
  resourceNames:
    - rabbitmq
    - slingshot-rabbitmq
    - surveyor-cgapp-api-exporter-rabbitmq
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - patch
  resourceNames:
    - slingshot-rabbitmq
    - surveyor-cgapp-api-exporter-rabbitmq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: initialize-rabbitmq-role
subjects:
- kind: ServiceAccount
  name: initialize-rabbitmq-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  name: initialize-rabbitmq-script
data:
  initialize.sh: |
    #!/bin/bash
    set -euo pipefail

    if ! kubectl get secret rabbitmq > /dev/null; then
        kubectl create secret generic rabbitmq --from-literal="rabbitmq-password={{ randAlphaNum 16 }}" --from-literal="rabbitmq-erlang-cookie={{ randAlphaNum 32 }}"
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-rabbitmq
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: initialize-rabbitmq-sa
      automountServiceAccountToken: true
      containers:
      - name: initialize-rabbitmq-container
        image: bitnami/kubectl
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c", "/tmp/rabbitmq/initialize.sh"]
        volumeMounts:
          - mountPath: /tmp/rabbitmq
            name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: initialize-rabbitmq-script
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: initialize-rabbitmq-to-kube-apiserver
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      job-name: initialize-rabbitmq
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
    - patch
  resourceNames:
    - slingshot-rabbitmq
    - surveyor-cgapp-api-exporter-rabbitmq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: setup-rabbitmq-role
subjects:
- kind: ServiceAccount
  name: setup-rabbitmq-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-rabbitmq-script
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail

    # Set up users
    for secret in slingshot-rabbitmq surveyor-cgapp-api-exporter-rabbitmq; do
      if [ -z "$(kubectl get secret $secret -o jsonpath='{.data.spring\.rabbitmq\.password}')" ]; then
        username="$(kubectl get secret $secret -o jsonpath='{.data.spring\.rabbitmq\.username}' | base64 -d)"
        generated_pwd="$(openssl rand -base64 30)"

        echo "$generated_pwd" | jq -R '{ password: ., tags: [] }' | \
          curl -u user:"$RABBITMQ_PASSWORD" \
            --fail-with-body \
            --silent \
            -X PUT \
            --json @- \
            http://rabbitmq:15672/api/users/$username

        echo "$generated_pwd" | jq -R '{stringData : {"spring.rabbitmq.password": . } }' | \
          kubectl patch secret $secret --patch-file=/dev/stdin
      fi
    done

    # Set up definitions
    curl -u user:"$RABBITMQ_PASSWORD" \
      --fail-with-body \
      --silent \
      -X POST \
      -H "Content-Type: application/json" \
      -T /tmp/rabbitmq/definitions.json \
      http://rabbitmq:15672/api/definitions

  definitions.json: {{ .Files.Get "definitions/rabbitmq.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-rabbitmq-{{ .Files.Get "definitions/rabbitmq.json" | sha1sum }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
spec:
  template:
    metadata:
      labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      serviceAccountName: setup-rabbitmq-sa
      automountServiceAccountToken: true
      initContainers:
        - name: copy-kubectl
          image: bitnami/kubectl
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              echo "copying 'kubectl' binary to shared volume...";
              cp -f "$(which kubectl)" /shared-bin/kubectl;
          volumeMounts:
            - name: shared-bin
              mountPath: "/shared-bin/"
      containers:
        - name: setup-rabbitmq-container
          image: bitnami/os-shell
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "/tmp/rabbitmq/setup.sh"]
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: rabbitmq-password
          volumeMounts:
            - mountPath: /usr/local/bin/kubectl
              name: shared-bin
              subPath: kubectl
            - mountPath: /tmp/rabbitmq
              name: patch
      volumes:
      - name: shared-bin
        emptyDir: {}
      - name: patch
        configMap:
          defaultMode: 0777
          name: setup-rabbitmq-script
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-setup-rabbitmq
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: message-queue
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: setup
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: setup-rabbitmq-to-rabbitmq
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: setup
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: message-queue
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: setup-rabbitmq-to-kube-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: setup
  egress:
    - toEntities:
        - kube-apiserver
