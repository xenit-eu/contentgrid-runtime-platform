{{ if .Values.rabbitmq.enabled }}
# Loads rabbitmq definitions after rabbitmq is up and running
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-role
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
    - patch
  resourceNames:
    - slingshot-rabbitmq
    - surveyor-cgapp-api-exporter-rabbitmq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.userapps.namespace }}
  name: setup-rabbitmq-role
rules:
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - get
    - patch
  resourceNames:
    - runtime-platform-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  name: setup-rabbitmq-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: setup-rabbitmq-role
subjects:
- kind: ServiceAccount
  name: setup-rabbitmq-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: setup-rabbitmq-role-binding
  namespace: {{ .Values.userapps.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: setup-rabbitmq-role
subjects:
- kind: ServiceAccount
  name: setup-rabbitmq-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-rabbitmq-script
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail

    # Set up users
    for secret in slingshot-rabbitmq surveyor-cgapp-api-exporter-rabbitmq; do
      if [ -z "$(kubectl get secret $secret -o jsonpath='{.data.spring\.rabbitmq\.password}')" ]; then
        username="$(kubectl get secret $secret -o jsonpath='{.data.spring\.rabbitmq\.username}' | base64 -d)"
        generated_pwd="$(openssl rand -base64 30)"

        echo "$generated_pwd" | jq -R '{ password: ., tags: [] }' | \
          curl -u user:"$RABBITMQ_PASSWORD" \
            --fail-with-body \
            --silent \
            -X PUT \
            --json @- \
            http://rabbitmq:15672/api/users/$username

        echo "$generated_pwd" | jq -R '{stringData : {"spring.rabbitmq.password": . } }' | \
          kubectl patch secret $secret --patch-file=/dev/stdin
      fi
    done

    if [ -z "$(kubectl get --namespace {{ .Values.userapps.namespace }} configmap runtime-platform-config -o jsonpath='{.data.spring\.rabbitmq\.password}')" ]; then
      username="$(kubectl get --namespace {{ .Values.userapps.namespace }} configmap runtime-platform-config  -o jsonpath='{.data.spring\.rabbitmq\.username}')"
      generated_pwd="$(openssl rand -base64 30)"

      echo "$generated_pwd" | jq -R '{ password: ., tags: [] }' | \
        curl -u user:"$RABBITMQ_PASSWORD" \
          --fail-with-body \
          --silent \
          -X PUT \
          --json @- \
          http://rabbitmq:15672/api/users/$username

      echo "$generated_pwd" | jq -R '{data : {"spring.rabbitmq.password": . } }' | \
        kubectl patch --namespace {{ .Values.userapps.namespace }} configmap runtime-platform-config  --patch-file=/dev/stdin
    fi


    # Set up definitions
    curl -u user:"$RABBITMQ_PASSWORD" \
      --fail-with-body \
      --silent \
      -X POST \
      -H "Content-Type: application/json" \
      -T /tmp/rabbitmq/definitions.json \
      http://rabbitmq:15672/api/definitions

  definitions.json: {{ .Files.Get "definitions/rabbitmq.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-rabbitmq-{{ .Files.Get "definitions/rabbitmq.json" | sha1sum }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: setup
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  template:
    metadata:
      labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      serviceAccountName: setup-rabbitmq-sa
      automountServiceAccountToken: true
      containers:
        - name: setup-rabbitmq-container
          image: ghcr.io/xenit-eu/kubectl
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "/tmp/rabbitmq/setup.sh"]
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
          volumeMounts:
            - mountPath: /tmp/rabbitmq
              name: patch
      volumes:
      - name: patch
        configMap:
          defaultMode: 0777
          name: setup-rabbitmq-script
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-setup-rabbitmq
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: message-queue
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: setup
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: setup-rabbitmq-to-rabbitmq
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: setup
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/component: message-queue
---
{{/* NetworkPolicy setup-rabbitmq-to-kube-apiserver */}}
{{- $selectorLabels := (list
      "app.kubernetes.io/name: rabbitmq"
      "app.kubernetes.io/component: setup"
) | join "\n" | fromYaml -}}
{{- template "contentgrid.apiserver-network-policy"
      dict
        "name" "setup-rabbitmq-to-kube-apiserver"
        "selectorLabels" $selectorLabels
        "rootScope" $ }}
{{ end }}
