---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathfinder
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pathfinder
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pathfinder
        app.kubernetes.io/component: pathfinder
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        prometheus.io/path: actuator/prometheus
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
        instrumentation.opentelemetry.io/inject-java: grafana-agent/grafana-instrumentation
    spec:
      containers:
        - name: pathfinder
          image: {{ .Values.pathfinder.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - name: management
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          env:
            - name: 'SPRING_CONFIG_IMPORT'
              value: 'file:/etc/pathfinder/application.yml'
          volumeMounts:
            - name: pathfinder-config-volume
              mountPath: /etc/pathfinder/
              readOnly: true
      volumes:
        - name: pathfinder-config-volume
          configMap:
            name: pathfinder-config
      serviceAccountName: pathfinder-serviceaccount
      automountServiceAccountToken: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pathfinder-config
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application.yml: |
    pathfinder:
        source:
            namespace: '{{ .Values.userapps.namespace }}'
            labels:
                '[app.contentgrid.com/service-type]': gateway
        target:
            namespace: '{{ .Release.Namespace }}'
            annotations:
                '[cert-manager.io/cluster-issuer]': 'letsencrypt-production'
            tls:
                {{ if .Values.userapps.defaultDomainSuffix -}}
                fallback-cn-hostname: 'managed-by.{{ .Values.userapps.defaultDomainSuffix }}'
                {{- end }}
            services:
                - path: /
                  pathType: Prefix
                  serviceName: gateway-service
                  servicePort: 8080
                - path: /.well-known/jwks.json
                  pathType: Exact
                  serviceName: slingshot-service
                  servicePortName: http
---
apiVersion: v1
kind: Service
metadata:
  name: pathfinder-service
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
      app.kubernetes.io/name: pathfinder
  ports:
    - name: management
      port: 8080
      targetPort: management
      appProtocol: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pathfinder-serviceaccount
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pathfinder-role
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pathfinder-rolebinding
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pathfinder-role
subjects:
- kind: ServiceAccount
  name: pathfinder-serviceaccount
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pathfinder-role
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - "networking.k8s.io"
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pathfinder-rolebinding
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pathfinder-role
subjects:
- kind: ServiceAccount
  name: pathfinder-serviceaccount
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pathfinder-to-apiserver
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/component: pathfinder
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pathfinder
      app.kubernetes.io/component: pathfinder
  egress:
    - toEntities:
        - kube-apiserver
