---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liaison
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/component: liaison
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
        app.kubernetes.io/component: liaison
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        prometheus.io/path: actuator/prometheus
        prometheus.io/port: '8081'
        prometheus.io/scrape: 'true'
        instrumentation.opentelemetry.io/inject-java: grafana-agent/grafana-instrumentation
    spec:
      containers:
        - name: liaison
          image: {{ .Values.liaison.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          {{- include "contentgrid.probes" "management" | indent 10 }}
          env:
            - name: 'SPRING_CONFIG_IMPORT'
              value: 'file:/etc/liaison/application.yml'
          volumeMounts:
            - name: liaison-config-volume
              mountPath: /etc/liaison/
              readOnly: true
      volumes:
        - name: liaison-config-volume
          configMap:
            name: liaison-config
      enableServiceLinks: false
      serviceAccountName: liaison-serviceaccount
      automountServiceAccountToken: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liaison-config
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application.yml: |
    liaison:
        discovery:
            webapp:
                namespace: '{{ .Values.userapps.namespace }}'
                resync-interval-seconds: 300
            gateway:
                namespace: '{{ .Values.userapps.namespace }}'
                resync-interval-seconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: liaison-service
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/component: liaison
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
    - name: management
      port: 8081
      targetPort: management
      appProtocol: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liaison-serviceaccount
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liaison-role
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liaison-rolebinding
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: liaison-role
subjects:
- kind: ServiceAccount
  name: liaison-serviceaccount
  namespace: {{ .Release.Namespace }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: liaison-to-apiserver
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: liaison
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/component: liaison
  egress:
    - toEntities:
        - kube-apiserver
