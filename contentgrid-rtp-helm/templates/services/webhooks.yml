---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: webhook-invoker
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webhooks
  replicas: 1
  template:
    metadata:
      labels:
        {{ if .Values.development -}}
        date: "{{ now | unixEpoch }}"
        {{- end }}
        app.kubernetes.io/name: webhooks
        app.kubernetes.io/component: webhook-invoker
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      containers:
        - name: webhooks
          image: {{ .Values.webhooks.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - containerPort: 80
          env:
            - name: 'SPRING_CONFIG_IMPORT'
              value: 'file:/etc/webhooks/application.yml'
          volumeMounts:
            - name: webhooks-config-volume
              mountPath: /etc/webhooks/
              readOnly: true
      volumes:
        - name: webhooks-config-volume
          configMap:
            name: webhooks-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhooks-config
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: webhook-invoker
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application.yml: |
    spring:
      rabbitmq:
        host: rabbitmq-service
---
apiVersion: v1
kind: Service
metadata:
  name: webhooks-service
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: webhook-invoker
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
      app.kubernetes.io/name: webhooks
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webhooks-mgmt-service
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: webhook-invoker
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: webhooks
  ports:
    - port: 8081
      targetPort: 8081
---
