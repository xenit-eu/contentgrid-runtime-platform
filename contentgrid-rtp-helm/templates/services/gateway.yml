---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  replicas: 1
  template:
    metadata:
      labels:
        {{ if .Values.development -}}
        date: "{{ now | unixEpoch }}"
        {{- end }}
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: proxy
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - containerPort: 80
          env:
            - name: 'OPA_SERVICE_URL'
              value: 'http://opa-service:8181'
            - name: SERVICEDISCOVERY_ENABLED
              value: 'true'
            - name: SERVICEDISCOVERY_NAMESPACE
              value: '{{ .Values.userapps.namespace }}'
            - name: 'SPRING_CONFIG_IMPORT'
              value: 'file:/etc/gateway/application.yml'
          volumeMounts:
            - name: gateway-config-volume
              mountPath: /etc/gateway/
              readOnly: true
      volumes:
        - name: gateway-config-volume
          configMap:
            name: gateway-config
      serviceAccountName: contentgrid-gateway
      automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application.yml: |
    contentgrid:
      gateway:
        cors:
          configurations:
            '[16e6ca50-f350-4d1f-b076-36680538e190.userapps.contentgrid.com]':
              allowedOrigins:
                - 'http://localhost:3000'
                - 'https://rgfnl-dev.s3-website.fr-par.scw.cloud'
    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: https://auth.contentgrid.com/realms/application-realm-prototype
          client:
            provider:
              application-realm-prototype:
                user-name-attribute: preferred_username
                issuer-uri: https://auth.contentgrid.com/realms/application-realm-prototype
            registration:
              application-realm-prototype:
                client-id: contentgrid-gateway
                client-secret: wkNlQcZ11AGh5CcV3p81JOQmzZuuBwcm
                scope: openid,profile,email
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
      app.kubernetes.io/name: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mgmt-service
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: contentgrid-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: contentgrid-gateway
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contentgrid-gateway
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: contentgrid-gateway
subjects:
- kind: ServiceAccount
  name: contentgrid-gateway
  namespace: {{ .Release.Namespace }}
