---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveyor-postgres-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: surveyor
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: surveyor
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        prometheus.io/path: actuator/prometheus
        prometheus.io/port: '8081'
        prometheus.io/scrape: 'true'
        instrumentation.opentelemetry.io/inject-java: grafana-agent/grafana-instrumentation
    spec:
      containers:
        - name: postgres-exporter
          image: {{ .Values.surveyor.postgresExporter.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          env:
            - name: 'MANAGEMENT_SERVER_PORT'
              value: '8081'
            - name: 'SURVEYOR_EXPORTER_KUBERNETES_NAMESPACE'
              value: '{{ .Values.userapps.namespace }}'
      enableServiceLinks: false
      serviceAccountName: surveyor-postgres-exporter-serviceaccount
      automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: surveyor-postgres-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surveyor-postgres-exporter-serviceaccount
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: surveyor-postgres-exporter-role
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: surveyor-postgres-exporter-rolebinding
  namespace: {{ .Values.userapps.namespace }}
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: surveyor-postgres-exporter-role
subjects:
- kind: ServiceAccount
  name: surveyor-postgres-exporter-serviceaccount
  namespace: {{ .Release.Namespace }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: surveyor-postgres-exporter-to-apiserver
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: surveyor
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surveyor-postgres-exporter-from-prometheus
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: surveyor
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: surveyor

{{ if .Values.userapps.database }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surveyor-postgres-exporter-to-database
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: surveyor
  egress:
    {{ range $db := .Values.userapps.database }}
    - to:
        - ipBlock:
            cidr: {{ $db.ip }}/24
      ports:
        - port: {{ $db.port }}
    {{ end }}
{{ end }}
