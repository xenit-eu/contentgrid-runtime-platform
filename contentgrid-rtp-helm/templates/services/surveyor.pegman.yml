{{ if .Values.surveyor.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveyor-pegman
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pegman
      app.kubernetes.io/component: surveyor
      app.kubernetes.io/part-of: contentgrid-runtimeplatform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pegman
        app.kubernetes.io/component: surveyor
        app.kubernetes.io/part-of: contentgrid-runtimeplatform
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        prometheus.io/path: '/actuator/prometheus'
        prometheus.io/port: '8081'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: pegman
          image: {{ .Values.surveyor.pegman.image }}
          {{ if .Values.development -}}
          imagePullPolicy: Always
          {{- end }}
          {{- include "contentgrid.resources" (dict "requests" .Values.surveyor.pegman.resourceRequests "limits" .Values.surveyor.pegman.resourceLimits) | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          {{ if not .Values.surveyor.pegman.debug -}}
          {{- include "contentgrid.probes" "management" | indent 10 }}
          {{- end }}
          env:
            - name: 'SPRING_CONFIG_IMPORT'
              value: 'file:/etc/pegman/config/application.yml,configtree:/etc/pegman/config/*/'
            {{ if .Values.surveyor.pegman.debug -}}
            - name: 'JAVA_TOOL_OPTIONS'
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005"
            {{- end }}
          volumeMounts:
            - name: pegman-config
              mountPath: /etc/pegman/config
              readOnly: true
            - name: pegman-systems
              mountPath: /etc/pegman/config/systems
              readOnly: true
            - name: pegman-systems-tokens
              mountPath: /etc/pegman/config/systems-tokens
              readOnly: true
      volumes:
        - name: pegman-config
          configMap:
            name: surveyor-pegman-config
        - name: pegman-systems
          configMap:
            name: surveyor-pegman-systems
        - name: pegman-systems-tokens
          secret:
            secretName: surveyor-pegman-systems
      enableServiceLinks: false
      automountServiceAccountToken: false
{{ include "nodeSelection" . | indent 6}}
---
apiVersion: v1
kind: Service
metadata:
  name: surveyor-pegman
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: surveyor-pegman-config
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-management
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application.yml: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: surveyor-pegman-systems
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  surveyor.systems.prometheus.rtp-internal.name: runtime
  surveyor.systems.prometheus.rtp-internal.type: runtime
  surveyor.systems.prometheus.rtp-internal.url: http://surveyor-prometheus
  {{- with .Values.surveyor.pegman.extraConfig }}
  {{- tpl . $ | indent 2 -}}
  {{- end }}
---
{{ if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
{{ else }}
apiVersion: v1
kind: Secret
{{ end }}
metadata:
  name: surveyor-pegman-systems
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
{{ if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStoreName }}
  dataFrom:
    - extract:
        key: {{ .Values.surveyor.pegman.systems.secretKey }}
{{ else }}
stringData:
  {{ .Values.surveyor.pegman.systems.secret | toYaml | nindent 2 }}
{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surveyor-pegman-to-prometheus
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pegman
      app.kubernetes.io/component: surveyor
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: surveyor
---
{{ if .Capabilities.APIVersions.Has "cilium.io/v2" }}
{{- $egress := tpl .Values.surveyor.pegman.extraCiliumNetworkPolicyEgress $ | trim }}
{{ if $egress }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: surveyor-pegman-to-extra
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pegman
      app.kubernetes.io/component: surveyor
  egress:
    {{- printf "\n%s" $egress | indent 4 }}
{{ end }}
{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: surveyor-pegman
  annotations:
    {{- with .Values.certificates.defaultIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
  - host: {{ .Values.surveyor.pegman.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: surveyor-pegman
            port:
              name: http
  tls:
  - secretName: surveyor-pegman-tls
    hosts:
    - {{ .Values.surveyor.pegman.host }}
---
{{ if .Capabilities.APIVersions.Has "cilium.io/v2" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: surveyor-pegman-to-auth
  labels:
    app.kubernetes.io/name: pegman
    app.kubernetes.io/component: surveyor
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pegman
      app.kubernetes.io/component: surveyor
  egress:
    - toFQDNs:
        - matchName: "auth.contentgrid.com"
      toPorts:
        - ports:
            - port: "443"
{{ end }}
{{ end }}