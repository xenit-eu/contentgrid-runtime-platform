{{ with .Values.certificates.issuers }}
{{ range $name, $settings := . }}
{{ with $settings.acme }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    email: {{ .email }}
    server: {{ .server }}
    {{- with .externalAccountBinding }}
    externalAccountBinding:
      keyID: {{ .keyId }}
      keySecretRef:
        name: {{ .secretName }}
        key: eab-credentials
    {{- end }}
    privateKeySecretRef:
      name: {{ $name }}-accountkey
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
{{ end }}
{{ end }}
{{ end }}
