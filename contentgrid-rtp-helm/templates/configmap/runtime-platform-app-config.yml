apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: contentgrid-runtime
  name: runtime-platform-config
  namespace: default
data:
  server.forward-headers-strategy: native
  server.tomcat.remoteip.internal-proxies: 100\.64\.\d{1,3}\.\d{1,3}
  management.endpoints.web.exposure.include: '*'
# TODO uncomment this when it doesn't break spring boot any more (see https://github.com/spring-projects/spring-boot/issues/32941)
#  management.server.port: "8081"
