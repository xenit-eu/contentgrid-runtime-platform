apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: contentgrid-runtime
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  name: runtime-platform-config
  namespace: {{ .Values.userapps.namespace }}
data:
  server.forward-headers-strategy: native
  server.tomcat.remoteip.internal-proxies: 100\.64\.\d{1,3}\.\d{1,3}
  management.endpoints.web.exposure.include: '*'
  management.server.port: '8081'
  spring.datasource.hikari.minimum-idle: "0"
  contentgrid.audit.messaging.source: "https://{{ .Values.userapps.defaultDomainSuffix }}"
  contentgrid.audit.messaging.destination: 'surveyor-cgapp-api-exporter'
{{- if default true .Values.rabbitmq.enabled }}
  spring.rabbitmq.host: {{ include "rabbitmq_host" .}}
  spring.rabbitmq.username: guest
  spring.rabbitmq.password: guest
{{- end }}
  contentgrid.security.csrf.disabled: 'true'
  contentgrid.security.unauthenticated.allow: 'true'
