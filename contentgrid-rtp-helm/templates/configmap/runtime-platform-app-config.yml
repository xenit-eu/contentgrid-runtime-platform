apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: contentgrid-runtime
  name: runtime-platform-config
  namespace: default
data:
  server.forward-headers-strategy: native
  server.tomcat.remoteip.internal-proxies: 100\.64\.\d{1,3}\.\d{1,3}
  management.endpoints.web.exposure.include: '*'
  management.server.port: '8081'
  spring.rabbitmq.host: rabbitmq-service.contentgrid-system.svc.cluster.local
  spring.rabbitmq.username: guest
  spring.rabbitmq.password: guest
  spring.datasource.hikari.minimum-idle: "0"
