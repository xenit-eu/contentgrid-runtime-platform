secretStoreName: xenit-secretstore-accesskey

surveyor:
  pegman:
    scaleway:
      region: fr-par
    host: metrics.sandbox.contentgrid.cloud

userapps:
  database:
    - ip: 51.159.75.175
      port: "21065"
  defaultDomainSuffix: sandbox.contentgrid.cloud
  ingressClassName: haproxy
  objectstorage:
    - fqdn:
        name: "s3.fr-par.scw.cloud"
        pattern: "*.s3.fr-par.scw.cloud"
      port: "443"

keycloak:
  host: auth.sandbox.contentgrid.cloud

keycloakx:
