  defaultIssuer: gcloud-ca-production
  issuers:
    gcloud-ca-production:
      acme:
        email: contentgrid@xenit.eu
        server: https://dv.acme-v02.api.pki.goog/directory
        externalAccountBinding:
          keyId: d085c9ef75f2f9e48c62d0f61d975d3f
          secretName: gcloud-ca-production-eab
    letsencrypt-production: {}

tokenmonger:
  host: extensions.sandbox.contentgrid.cloud

