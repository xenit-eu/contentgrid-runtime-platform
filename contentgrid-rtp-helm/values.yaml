surveyor:
  enabled: true
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:30e870b613ae149a65f2c544ad5d7f3bf4cb517e6c9c79eb5b460aa03dd39647
    host: ~
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
    systems:
      secretKey: name:surveyor-scaleway-token
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:f6f437024e93e9679dcf8e42a6aa478d4cc3fcfdf24cb145c228929b7292df47
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:84200e583786beb5da00e1f9c3396d81008804f33b532b7103fed1121e301edc
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 1Gi

