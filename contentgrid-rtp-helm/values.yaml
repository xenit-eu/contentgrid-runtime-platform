gateway:
  image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:6b46762a32fb0e91ad7852b4825e64910800959cf860bc6dea3faf125117e27a
  debug: false
  accessLogging: false
#  maxInitialLineLength: 4096  # increase to allow longer URLs (e.g. many query parameters)
  # Resource requests are kept modest so the chart fits small clusters (e.g. customer
  # sites, CI). Bump these per environment for production-scale traffic.
  resourceRequests:
    cpu: 250m
    memory: 768Mi
  resourceLimits:
    memory: 1Gi
    # No CPU limit: avoids CFS throttling spikes on latency-sensitive proxies.
tokenmonger:
  image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:c247baf95a4f3821434884c4316b38472feadffd1d0fe42c022715d0d452d2e7
  host: ~
  protocol: https
  debug: false
  resourceRequests:
    cpu: 100m
    memory: 512Mi
  resourceLimits:
    # The buildpack memory calculator sets the JVM memory arguments based on a calculation using the memory limit.
    # Put the limit too low, and the calculation will result in a container that won't start. But without a limit,
    # the calculation will use the node limit which will result in a very high memory limit, iso just garbage collecting
    # or scaling horizontally.
    memory: 1Gi
  ingress:
    name: tokenmonger
    tls: true
    annotations: {}
opa:
  image: docker.io/openpolicyagent/opa:1.22.3@sha256:c1632ced2b6726a257a075523ce4d86258b721b5512e05ee3344ae26148e9031
  resourceRequests:
    cpu: 50m
    memory: 381Mi
  resourceLimits:
    memory: 1Gi
solon:
