gateway:
  image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:1252420f51a4e1ed20220667bdda4416e22827535287fab6fd7ec448e9c6aba2
  debug: false
  accessLogging: false
#  maxInitialLineLength: 4096  # increase to allow longer URLs (e.g. many query parameters)
  # Resource requests are kept modest so the chart fits small clusters (e.g. customer
  # sites, CI). Bump these per environment for production-scale traffic.
  resourceRequests:
    cpu: 250m
    memory: 768Mi
  resourceLimits:
    memory: 1Gi
    # No CPU limit: avoids CFS throttling spikes on latency-sensitive proxies.
tokenmonger:
  image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:9fa0dfc5f9922e8e545b04010bad46a473e88035ba95a3131bdca28aec7806a0
  host: ~
  protocol: https
  debug: false
  resourceRequests:
    cpu: 100m
    memory: 512Mi
  resourceLimits:
    # The buildpack memory calculator sets the JVM memory arguments based on a calculation using the memory limit.
    # Put the limit too low, and the calculation will result in a container that won't start. But without a limit,
    # the calculation will use the node limit which will result in a very high memory limit, iso just garbage collecting
    # or scaling horizontally.
    memory: 1Gi
  ingress:
    name: tokenmonger
    tls: true
    annotations: {}
opa:
  image: docker.io/openpolicyagent/opa:1.22.0@sha256:895872de1e8dc5b82e04f9410d2d1ada2f72d28fdcdba0e8789d91cfc27ec0d0
  resourceRequests:
    cpu: 50m
    memory: 381Mi
  resourceLimits:
