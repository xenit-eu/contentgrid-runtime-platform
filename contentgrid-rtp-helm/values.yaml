surveyor:
  enabled: true
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:a29567105f560aeaf17fd45e21c2a80183497ecc10b45d6366e03de046687850
    host: ~
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
    systems:
      secretKey: name:surveyor-scaleway-token
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:c12002bce29e50571247abb6ccf63b67935ef7e0494eb6e1bc0cb9ea2744380a
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:9d7bfb9b07db50916b30031792615d28ac9c0306ecea162b64ddc19f8133240d
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 1Gi

userapps:
