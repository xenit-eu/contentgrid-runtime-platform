gateway:
  image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:b577c087b76e2aede3d187ea8edbc7ca4bb891df95b1a44ee37f155674e9ca85
  debug: false
  accessLogging: false
#  maxInitialLineLength: 4096  # increase to allow longer URLs (e.g. many query parameters)
  # Resource requests are kept modest so the chart fits small clusters (e.g. customer
  # sites, CI). Bump these per environment for production-scale traffic.
  resourceRequests:
    cpu: 250m
    memory: 768Mi
  resourceLimits:
    memory: 1Gi
    # No CPU limit: avoids CFS throttling spikes on latency-sensitive proxies.
tokenmonger:
  image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:5dfb4600a55bb9cd6308313066bd89f714a5dfecb1883cf1b78b7d6a4a324f02
  host: ~
  protocol: https
  debug: false
  resourceRequests:
    cpu: 100m
    memory: 512Mi
  resourceLimits:
    # The buildpack memory calculator sets the JVM memory arguments based on a calculation using the memory limit.
    # Put the limit too low, and the calculation will result in a container that won't start. But without a limit,
    # the calculation will use the node limit which will result in a very high memory limit, iso just garbage collecting
    # or scaling horizontally.
    memory: 1Gi
  ingress:
    name: tokenmonger
    tls: true
    annotations: {}
opa:
  image: docker.io/openpolicyagent/opa:1.22.1@sha256:25250ef155393abcdf6c641960051247ee6c544d3943465ce5ec8088e1fd3a00
  resourceRequests:
    cpu: 50m
    memory: 381Mi
  resourceLimits:
    memory: 1Gi
