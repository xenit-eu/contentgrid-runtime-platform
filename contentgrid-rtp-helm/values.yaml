  blueprint:
    secretKey: 'path:/rtp/blueprint-artifacts-objectstorage'
  #defaultDomainSuffix: ~
  #database:
    #- ip: ~
    #  port: ~

development: true

jobs:
  resourceLimits:
    cpu: 200m
    memory: 512Mi

keycloak:
