#  tolerations:
#    - key: "example.com/node-role"
#      operator: "Equal"
#      value: "contentgrid"


keycloakx:
  enabled: true
  image:
    # Explicitly configuring the repository allows renovatebot to send image update PRs
    repository: quay.io/keycloak/keycloak
    tag: 26.7.2
  fullnameOverride: keycloak # this is used for the name of the service that we use in the ingress
  replicas: 1
  resources:
    # Request == limits so it keycloak is a guaranteed pod https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#guaranteed
    requests:
      cpu: 2
      memory: 1536Mi
    limits:
      cpu: 2
      memory: 1536Mi
  args:
    - 'start'
    - '--hostname-strict=false'
    - '--import-realm'
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djava.awt.headless=true
  proxy:
    mode: xforwarded
  database:
    vendor: postgres
    hostname: ~
    port: ~
    database: keycloak
    username: keycloak
    existingSecret: keycloak-database
  http:
    relativePath: /
  service:
    httpPort: 8080
  extraInitContainers: |
    - name: theme-provider
      image: ghcr.io/xenit-eu/contentgrid-keycloak-themes:0.0.1-snapshot
      imagePullPolicy: Always
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying theme..."
          cp -R /contentgrid-keycloak-themes/* /theme
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: theme
          mountPath: /theme

  extraVolumeMounts: |
    - name: theme
      mountPath: /opt/keycloak/providers/
    - name: realms-import
      mountPath: /opt/keycloak/data/import/
  extraVolumes: |
    - name: theme
      emptyDir: {}
    - name: realms-import
      configMap:
        name: keycloak-realms-import

rabbitmq:
  enabled: true
  image:
    repository: docker.io/rabbitmq
    tag: '4.3-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631'
  fullnameOverride: rabbitmq
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
  resources:
    # Request == limits so it rabbitmq is a guaranteed pod https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#guaranteed
    requests:
      cpu: 750m
      memory: 1536Mi
    limits:
      cpu: 750m
      memory: 1536Mi
      ephemeral-storage: 2Gi
  podLabels:
    app.kubernetes.io/component: message-queue
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
