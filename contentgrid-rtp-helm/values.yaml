gateway:
  image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:1db8117243af0cc0670251d9229bfca9d789cc7cc78e0b5a0e5d5a64b287400c
  debug: false
  accessLogging: false
#  maxInitialLineLength: 4096  # increase to allow longer URLs (e.g. many query parameters)
  # Resource requests are kept modest so the chart fits small clusters (e.g. customer
  # sites, CI). Bump these per environment for production-scale traffic.
  resourceRequests:
    cpu: 250m
    memory: 768Mi
  resourceLimits:
    memory: 1Gi
    # No CPU limit: avoids CFS throttling spikes on latency-sensitive proxies.
tokenmonger:
  image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:c594b88ed12fc98ccfbdc665b06af31c1113f3a4891f5cc5bfc41a67b58c7425
  host: ~
  protocol: https
  debug: false
  resourceRequests:
    cpu: 100m
    memory: 512Mi
  resourceLimits:
    # The buildpack memory calculator sets the JVM memory arguments based on a calculation using the memory limit.
    # Put the limit too low, and the calculation will result in a container that won't start. But without a limit,
    # the calculation will use the node limit which will result in a very high memory limit, iso just garbage collecting
    # or scaling horizontally.
    memory: 1Gi
  ingress:
    name: tokenmonger
    tls: true
    annotations: {}
opa:
  image: docker.io/openpolicyagent/opa:1.22.2@sha256:951ed07a3a41f5b02f68bf6f94ba1c952642daa597c89420986fd597eb09e661
  resourceRequests:
    cpu: 50m
    memory: 381Mi
  resourceLimits:
