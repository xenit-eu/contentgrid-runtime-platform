gateway:
  image: ghcr.io/xenit-eu/contentgrid-gateway:SNAPSHOT@sha256:96743ff3ba726636eb2b7a18d11db2e455ded59912f1da5cdbeb981b665d9f34
  debug: false
  accessLogging: false
#  maxInitialLineLength: 4096  # increase to allow longer URLs (e.g. many query parameters)
  # Resource requests are kept modest so the chart fits small clusters (e.g. customer
  # sites, CI). Bump these per environment for production-scale traffic.
  resourceRequests:
    cpu: 250m
    memory: 768Mi
  resourceLimits:
    memory: 1Gi
    # No CPU limit: avoids CFS throttling spikes on latency-sensitive proxies.
tokenmonger:
  image: ghcr.io/xenit-eu/contentgrid-tokenmonger:SNAPSHOT@sha256:c303bd1385fedd6fb1ca73ebda814ce2af909b86b50854a884069c1b118df5d6
  host: ~
  protocol: https
  debug: false
  resourceRequests:
    cpu: 100m
    memory: 512Mi
  resourceLimits:
    # The buildpack memory calculator sets the JVM memory arguments based on a calculation using the memory limit.
    # Put the limit too low, and the calculation will result in a container that won't start. But without a limit,
    # the calculation will use the node limit which will result in a very high memory limit, iso just garbage collecting
    # or scaling horizontally.
    memory: 1Gi
  ingress:
    name: tokenmonger
    tls: true
    annotations: {}
opa:
  image: docker.io/openpolicyagent/opa:1.21.0@sha256:9e0010512cf405e66bfd7b89394f514e56fe0464822df0527e780344ab151450
