surveyor:
  enabled: true
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:7cde4e4251c62a0b9a0ca61ca7fb6e8af7dac134088dec7ea6ce6fc49f7ea157
    host: ~
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
    systems:
      secretKey: name:surveyor-scaleway-token
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:15c70311cc839e81ca1da9c08a2ca2b1016b107d88cf120ed161be3b23c394dc
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:c8402fe889664af560067624999674e6a23feda8349fb11f88d0fbf890e79df7
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 1Gi

userapps:
  namespace: default
  ingressClassName: haproxy
  forwardHeadersTrustedIp: '100\.64\.\d{1,3}\.\d{1,3}'
  blueprint:
    secretKey: 'path:/rtp/blueprint-artifacts-objectstorage'
  #defaultDomainSuffix: ~
  #database:
    #- ip: ~
    #  port: ~

development: true

jobs:
  image: ghcr.io/xenit-eu/kubectl
  resourceLimits:
    cpu: 200m
    memory: 512Mi

keycloak:
  host: ~
  protocol: https
  db:
    secretKey: path:/rtp/keycloak-db-password
  extraRealms: {}
  ingress:
    name: contentgrid-keycloak
    tls: true
    annotations: {}

certificates:
  defaultIssuer: letsencrypt-production
#  issuers:
#    my-issuer:
#      acme:
#        email: ~
#        server: ~
#        externalAccountBinding:
#          keyId: ~
#          secretName: ~

pods:
#  nodeSelector:
#    example.com/node-role: contentgrid
#  tolerations:
#    - key: "example.com/node-role"
#      operator: "Equal"
#      value: "contentgrid"


keycloakx:
  enabled: true
  image:
    # Explicitly configuring the repository allows renovatebot to send image update PRs
    repository: quay.io/keycloak/keycloak
    tag: 26.8.2
    digest: sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
  fullnameOverride: keycloak # this is used for the name of the service that we use in the ingress
  replicas: 1
  resources:
    # Request == limits so it keycloak is a guaranteed pod https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#guaranteed
    requests:
      cpu: 2
      memory: 1536Mi
    limits:
      cpu: 2
      memory: 1536Mi
  args:
    - 'start'
    - '--hostname-strict=false'
    - '--import-realm'
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djava.awt.headless=true
  proxy:
    mode: xforwarded
  database:
    vendor: postgres
    hostname: ~
    port: ~
    database: keycloak
    username: keycloak
    existingSecret: keycloak-database
  http:
    relativePath: /
  service:
    httpPort: 8080
  extraInitContainers: |
    - name: theme-provider
      image: ghcr.io/xenit-eu/contentgrid-keycloak-themes:0.0.1-snapshot
      imagePullPolicy: Always
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying theme..."
          cp -R /contentgrid-keycloak-themes/* /theme
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: theme
          mountPath: /theme

  extraVolumeMounts: |
    - name: theme
      mountPath: /opt/keycloak/providers/
    - name: realms-import
      mountPath: /opt/keycloak/data/import/
  extraVolumes: |
    - name: theme
      emptyDir: {}
    - name: realms-import
      configMap:
        name: keycloak-realms-import

rabbitmq:
  enabled: true
  image:
    repository: docker.io/rabbitmq
    tag: '4.4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407'
  fullnameOverride: rabbitmq
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
  resources:
    # Request == limits so it rabbitmq is a guaranteed pod https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#guaranteed
    requests:
      cpu: 750m
      memory: 1536Mi
    limits:
      cpu: 750m
      memory: 1536Mi
      ephemeral-storage: 2Gi
  podLabels:
    app.kubernetes.io/component: message-queue
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
