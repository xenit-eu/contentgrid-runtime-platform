  ingressClassName: haproxy
  forwardHeadersTrustedIp: '100\.64\.\d{1,3}\.\d{1,3}'
  blueprint:
    secretKey: 'path:/rtp/blueprint-artifacts-objectstorage'
  #defaultDomainSuffix: ~
  #database:
    #- ip: ~
    #  port: ~

development: true

jobs:
  resourceLimits:
    cpu: 200m
    memory: 512Mi

keycloak:
  host: ~
  protocol: https
  db:
    secretKey: path:/rtp/keycloak-db-password
  extraRealms: {}
  ingress:
    name: contentgrid-keycloak
    tls: true
    annotations: {}

