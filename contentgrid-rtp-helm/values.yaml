surveyor:
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:e1a01758fcf6c53652ad3514babcf43f286b3a9410d572816c70296b33700fd6
    host: ~
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraSecrets: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.headers.x-token: {{ .token | b64enc }}
      surveyor.systems.prometheus.scaleway-logs.headers.x-token: {{ .token | b64enc }}
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:bf1f28eab2a0543ea32e82224e870427a4a85ec1723cc2fbac762146ac3e099e
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:160ee73827e6c906eb775d454602a9496d935b862af656803220a023d6301b24

userapps:
  namespace: default
  ingressClassName: nginx
  #defaultDomainSuffix: ~
  #database:
    #- ip: ~
    #  port: ~

development: true

keycloak:
  host: ~

certificates:
  defaultIssuer: letsencrypt-production
#  issuers:
#    my-issuer:
#      acme:
#        email: ~
#        server: ~
#        externalAccountBinding:
#          keyId: ~
#          secretName: ~


keycloakx:
  enabled: true
  image:
    # Explicitly configuring the repository allows renovatebot to send image update PRs
    repository: quay.io/keycloak/keycloak
    tag: 25.0.2
  fullnameOverride: keycloak # this is used for the name of the service that we use in the ingress
  replicas: 1
  args:
    - 'start'
    - '--hostname-strict=false'
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djava.awt.headless=true
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
  proxy:
    mode: xforwarded
  database:
    vendor: postgres
    hostname: ~
    port: ~
    database: keycloak
    username: keycloak
    existingSecret: keycloak-database
  http:
    relativePath: /
  service:
    httpPort: 8080
  extraPorts:
    - containerPort: 7800
  extraInitContainers: |
    - name: theme-provider
      image: ghcr.io/xenit-eu/contentgrid-keycloak-themes:0.0.1-snapshot
      imagePullPolicy: Always
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying theme..."
          cp -R /contentgrid-keycloak-themes/* /theme
      volumeMounts:
        - name: theme
          mountPath: /theme

  extraVolumeMounts: |
    - name: theme
      mountPath: /opt/keycloak/providers/

  extraVolumes: |
    - name: theme
      emptyDir: {}

rabbitmq:
  fullnameOverride: rabbitmq
  enableServiceLinks: false
  resourcesPreset: medium
  auth:
    existingPasswordSecret: rabbitmq
    existingErlangSecret: rabbitmq
  networkPolicy:
    enabled: true
  metrics:
    enabled: true
  volumePermissions:
    enabled: true
  commonLabels:
    app.kubernetes.io/component: message-queue
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
