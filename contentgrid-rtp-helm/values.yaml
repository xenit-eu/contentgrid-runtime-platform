surveyor:
  enabled: true
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:545b2046a39114d01ae6203f547a7285ff450c1ee3688d78c2a7c638daebae2b
    host: ~
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
    systems:
      secretKey: name:surveyor-scaleway-token
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:e52d9786ca71876a2c1ae213c15aeab4afe3bf33795c56574999a2a11e96f34c
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 768Mi
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:3721bb4e670a09c2924c632caee3aa4d7c0b7ead49d7ddd388ca5e241ad157a9
    debug: false
    resourceRequests:
      cpu: 100m
      memory: 512Mi
    resourceLimits:
      memory: 1Gi

