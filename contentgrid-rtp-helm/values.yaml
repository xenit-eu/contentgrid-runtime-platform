surveyor:
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:ff7e389acbe064a4823212a500393d40a28a8f362e4b05cbf6742a9a3ef736b2
  pegman:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-pegman:SNAPSHOT@sha256:1d3f0ab3bc68b0b36ba81e7fe92a6a85788edff396dcf1ec72d2257b35b2f5f6
    host: ~
    debug: false
    extraConfig: |
      {{- with .Values.surveyor.pegman.scaleway }}
      surveyor.systems.prometheus.scaleway-metrics.name: runtime
      surveyor.systems.prometheus.scaleway-metrics.type: scaleway:prometheus
      surveyor.systems.prometheus.scaleway-metrics.url: https://metrics.cockpit.{{ .region }}.scw.cloud/prometheus
      surveyor.systems.prometheus.scaleway-metrics.headers.x-datasource: product

      surveyor.systems.prometheus.scaleway-logs.name: runtime
      surveyor.systems.prometheus.scaleway-logs.type: scaleway:loki
      surveyor.systems.prometheus.scaleway-logs.url: https://logs.cockpit.{{ .region }}.scw.cloud/loki
      surveyor.systems.prometheus.scaleway-logs.headers.x-datasource: product
      {{- end }}
    extraCiliumNetworkPolicyEgress: |
      {{- with .Values.surveyor.pegman.scaleway }}
      - toFQDNs:
          - matchName: "metrics.cockpit.{{ .region }}.scw.cloud"
          - matchName: "logs.cockpit.{{ .region }}.scw.cloud"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
    systems:
      secretKey: name:surveyor-scaleway-token
#    scaleway:
#      region: fr-par
#      token:
  postgresExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-postgres:SNAPSHOT@sha256:b445b4930fce159a7fa52741a3616bc3d6701e53be9eaf580b1a1b59a7b3a2f4
    debug: false
  cgappApiExporter:
    image: ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp-api:SNAPSHOT@sha256:46f58eea22dfe26458555d1fdaf095b5a6bf3ae0fcbec8cda9081955e0ab6e9e
    debug: false

userapps:
  namespace: default
  ingressClassName: haproxy
  forwardHeadersTrustedIp: '100\.64\.\d{1,3}\.\d{1,3}'
  #defaultDomainSuffix: ~
  #database:
    #- ip: ~
    #  port: ~

development: true

jobs:
  resourceLimits:
    cpu: 200m
    memory: 512Mi

keycloak:
  host: ~
  protocol: https
  db:
    secretKey: path:/rtp/keycloak-db-password
  extraRealms: {}

certificates:
  defaultIssuer: letsencrypt-production
#  issuers:
#    my-issuer:
#      acme:
#        email: ~
#        server: ~
#        externalAccountBinding:
#          keyId: ~
#          secretName: ~

pods:
#  nodeSelector:
#    example.com/node-role: contentgrid
#  tolerations:
#    - key: "example.com/node-role"
#      operator: "Equal"
#      value: "contentgrid"


keycloakx:
  enabled: true
  image:
    # Explicitly configuring the repository allows renovatebot to send image update PRs
    repository: quay.io/keycloak/keycloak
    tag: 26.4.1
  fullnameOverride: keycloak # this is used for the name of the service that we use in the ingress
  replicas: 1
  args:
    - 'start'
    - '--hostname-strict=false'
    - '--import-realm'
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djava.awt.headless=true
  proxy:
    mode: xforwarded
  database:
    vendor: postgres
    hostname: ~
    port: ~
    database: keycloak
    username: keycloak
    existingSecret: keycloak-database
  http:
    relativePath: /
  service:
    httpPort: 8080
  extraInitContainers: |
    - name: theme-provider
      image: ghcr.io/xenit-eu/contentgrid-keycloak-themes:0.0.1-snapshot
      imagePullPolicy: Always
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying theme..."
          cp -R /contentgrid-keycloak-themes/* /theme
      volumeMounts:
        - name: theme
          mountPath: /theme

  extraVolumeMounts: |
    - name: theme
      mountPath: /opt/keycloak/providers/
    - name: realms-import
      mountPath: /opt/keycloak/data/import/
  extraVolumes: |
    - name: theme
      emptyDir: {}
    - name: realms-import
      configMap:
        name: keycloak-realms-import

rabbitmq:
  enabled: true
  fullnameOverride: rabbitmq
  enableServiceLinks: false
  resourcesPreset: medium
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    existingPasswordSecret: rabbitmq
    existingErlangSecret: rabbitmq
  networkPolicy:
    enabled: true
  metrics:
    enabled: true
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell
  commonLabels:
    app.kubernetes.io/component: message-queue
    app.kubernetes.io/part-of: contentgrid-runtimeplatform
