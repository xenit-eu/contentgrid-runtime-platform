plugins {
    id 'java-library'
    id 'io.freefair.lombok' version '9.5.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")
    implementation platform("io.fabric8:kubernetes-client-bom:7.8.0")


    testImplementation 'com.contentgrid.helm.integrationtesting:contentgrid-junit-jupiter-k8s:0.1.12'
    testImplementation 'com.contentgrid.helm.integrationtesting:contentgrid-helm-client:0.1.12'
    testImplementation 'com.contentgrid.helm.integrationtesting:contentgrid-testcontainers-k3s-cilium:0.1.12'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.fabric8:kubernetes-junit-jupiter'
    testImplementation 'io.minio:minio:8.6.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-client'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

test {
    useJUnitPlatform()

    // This environment variable is used to construct links to services running in testcontainers
    // In a default setup, this defaults to 'localhost', but we need a host that resolves from both the
    // junit-platform-runner and from within other containers to the same mapped docker container ports
    // Suggestions:
    // - using Linux, set this to the docker0 bridge gateway ip address, usually 172.17.0.1
    // - using Windows: try 'gateway.docker.internal'
    // - using macOS with Colima, set the following env variables:
    //   - DOCKER_HOST_IP=host.docker.internal
    //   - TESTCONTAINERS_HOST_OVERRIDE="$(colima status --json | jq -r '.ip_address')" (this is the IP of the Colima VM).
    //   - TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock
    //   - DOCKER_HOST="unix://${HOME}/.colima/default/docker.sock"
    if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
        environment('TESTCONTAINERS_HOST_OVERRIDE', '172.17.0.1')
    }

    if (project.findProperty('disableDockerRegistryCache') ?: false) {
        systemProperty 'contentgrid.registryCache.disabled', 'true'
    }
}

