apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
    prometheus.io/path: actuator/prometheus
    prometheus.io/port: "8081"
    prometheus.io/scrape: "true"
  labels:
    app.contentgrid.com/app-id: $APP_ID
    app.contentgrid.com/application-id: $APP_ID
    app.contentgrid.com/deployment-id: $DEPLOYMENT_ID
    app.contentgrid.com/deployment-request-id: $DEPLOYMENT_ID
    app.contentgrid.com/service-type: api
    app.kubernetes.io/managed-by: contentgrid
  name: api-d-$DEPLOYMENT_ID
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.contentgrid.com/deployment-id: $DEPLOYMENT_ID
      app.contentgrid.com/service-type: api
      app.kubernetes.io/managed-by: contentgrid
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.contentgrid.com/deployment-id: $DEPLOYMENT_ID
        app.contentgrid.com/service-type: api
        app.kubernetes.io/managed-by: contentgrid
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SPRING_CONFIG_IMPORT
          value: configtree:/etc/app/config/*/
        - name: CONTENTGRID_SYSTEM_DEPLOYMENTID
          value: $DEPLOYMENT_ID
        - name: CONTENTGRID_SYSTEM_APPLICATIONID
          value: $APP_ID
        - name: CONTENTGRID_SYSTEM_POLICYPACKAGE
          value: $POLICY_PACKAGE
        - name: CONTENTGRID_EVENTS_WEBHOOKCONFIGURL
          value: http://api-d-$DEPLOYMENT_ID.default.svc.cluster.local:8081/actuator/webhooks
        image: $DOCKER_IMAGE
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: management
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: management
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: management
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 768Mi
          requests:
            cpu: 5m
            memory: 64Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health/liveness
            port: management
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/app/config/runtime
          name: rtp-shared-config
          readOnly: true
        - mountPath: /etc/app/config/db
          name: app-db-secrets
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      initContainers:
      - env:
        - name: SPRING_CONFIG_IMPORT
          value: configtree:/etc/app/config/*/
        - name: SPRING_PROFILES_ACTIVE
          value: initContainer
        - name: CONTENTGRID_SYSTEM_DEPLOYMENTID
          value: $DEPLOYMENT_ID
        - name: CONTENTGRID_SYSTEM_APPLICATIONID
          value: $APP_ID
        image: $DOCKER_IMAGE
        imagePullPolicy: IfNotPresent
        name: api-initcontainer
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/app/config/runtime
          name: rtp-shared-config
          readOnly: true
        - mountPath: /etc/app/config/db
          name: app-db-secrets
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: runtime-platform-config
          optional: true
        name: rtp-shared-config
      - name: app-db-secrets
        secret:
          defaultMode: 420
          secretName: $APP_ID-db

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    authz.contentgrid.com/policy-package: $POLICY_PACKAGE
  labels:
    app.contentgrid.com/app-id: $APP_ID
    app.contentgrid.com/application-id: $APP_ID
    app.contentgrid.com/deployment-id: $DEPLOYMENT_ID
    app.contentgrid.com/deployment-request-id: $DEPLOYMENT_ID
    app.contentgrid.com/service-type: api
    app.kubernetes.io/managed-by: contentgrid
  name: api-d-$DEPLOYMENT_ID
spec:
  #  clusterIP: 10.35.236.33
  #  clusterIPs:
  #  - 10.35.236.33
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: management
      port: 8081
      protocol: TCP
      targetPort: management
  selector:
    app.contentgrid.com/deployment-id: $DEPLOYMENT_ID
    app.contentgrid.com/service-type: api
    app.kubernetes.io/managed-by: contentgrid
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  contentgrid.cors.origins: ""
  contentgrid.routing.domains: "$APP_ID.apps.contentgrid.test"
kind: ConfigMap
metadata:
  #  annotations:
  #    cert-manager.io/cluster-issuer: gcloud-ca-production
  finalizers:
    - pathfinder.contentgrid.com/ingress
  labels:
    app.contentgrid.com/app-id: $APP_ID
    app.contentgrid.com/application-id: $APP_ID
    app.contentgrid.com/service-type: gateway
    app.kubernetes.io/managed-by: contentgrid
  name: $APP_ID-gw